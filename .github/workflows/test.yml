name: Test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run unit tests
        run: just test

  integration-tests:
    name: Integration Tests
    # Temporarily disabled: the Docker suite still stalls on GitHub runners.
    # Run it locally with `just test-integration` (serial) until the transport
    # work is finished. Re-enable by removing the `if` line.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run integration tests
        run: just test-integration
